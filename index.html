<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando restaurante...</title>
    <style>
        :root {
            --primary: #5a2e15;
            --accent: #00938f;
            --highlight: #e65100;
            --light: #f1f8f7;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; color: #333; background: #fcfcfc; }
        h1, h2, h3 { color: var(--primary); }
        .hero { text-align: center; background: #fff; padding: 40px 20px; border-bottom: 5px solid var(--accent); }
        .hero img { max-width: 100%; height: auto; max-height: 400px; border-radius: 10px; }
        .hero h1 { font-size: 2.5em; margin: 15px 0 5px; }
        .hero p { font-size: 1.2em; color: var(--highlight); font-weight: bold; font-style: italic; }
        .whatsapp-btn-container { margin: 30px 0; text-align: center; }
        .whatsapp-btn { display: inline-block; background: #25D366; color: white; font-size: 1.5em; font-weight: bold; text-decoration: none; padding: 20px 40px; border-radius: 50px; box-shadow: 0 4px 10px rgba(37, 211, 102, .4); transition: transform .3s, background-color .3s; }
        .whatsapp-btn:hover { background: #1ebe57; transform: scale(1.05); }
        .section { padding: 50px 20px; max-width: 900px; margin: 0 auto; text-align: center; }
        .section-alt { max-width: none; background: var(--light); }
        .menu-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
        .menu-item { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 20px; width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,.05); }
        .menu-item img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .menu-item h3 { margin-top: 12px; color: var(--accent); }
        .price { font-size: 1.2em; font-weight: bold; color: var(--highlight); }
        footer { background: var(--primary); color: white; text-align: center; padding: 20px; }
        .error { color: #a00; }
    </style>
</head>
<body>
    <header class="hero">
        <img id="restaurant-logo" src="" alt="">
        <h1 id="restaurant-name"></h1>
        <p id="restaurant-tagline"></p>
        <div class="whatsapp-btn-container">
            <a id="whatsapp-link" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">💬 Haz tu pedido por WhatsApp</a>
        </div>
    </header>

    <section class="section">
        <h2 id="welcome-title"></h2>
        <p id="welcome-text"></p>
    </section>

    <section class="section section-alt">
        <h2 id="menu-title"></h2>
        <div id="menu-grid" class="menu-grid"></div>
    </section>

    <footer>
        <p><strong id="footer-name"></strong></p>
        <p>📞 <span id="footer-phone"></span> | 📍 <span id="footer-address"></span></p>
        <p>&copy; <span id="footer-year"></span> Todos los derechos reservados.</p>
    </footer>

    <script>
        const text = (id, value) => { document.getElementById(id).textContent = value || ''; };

        async function loadRestaurant() {
            const [configResponse, menuResponse] = await Promise.all([
                fetch('config.json'),
                fetch('menu.json')
            ]);
            if (!configResponse.ok || !menuResponse.ok) throw new Error('No se pudo cargar la configuración.');
            const config = await configResponse.json();
            const menu = await menuResponse.json();

            document.title = config.name;
            const logo = document.getElementById('restaurant-logo');
            logo.src = config.logo;
            logo.alt = `Logo de ${config.name}`;
            text('restaurant-name', config.name);
            text('restaurant-tagline', config.tagline);
            text('welcome-title', config.welcomeTitle);
            text('welcome-text', config.welcomeText);
            text('menu-title', menu.title);
            text('footer-name', config.name);
            text('footer-phone', config.phoneDisplay);
            text('footer-address', config.address);
            text('footer-year', config.year || new Date().getFullYear());

            const whatsapp = document.getElementById('whatsapp-link');
            whatsapp.href = `https://wa.me/${config.whatsapp}`;
            if (config.orderMessage) whatsapp.href += `?text=${encodeURIComponent(config.orderMessage)}`;

            const grid = document.getElementById('menu-grid');
            menu.items.forEach(item => {
                const card = document.createElement('article');
                card.className = 'menu-item';
                const image = document.createElement('img');
                image.src = item.image;
                image.alt = item.name;
                image.loading = 'lazy';
                const name = document.createElement('h3');
                name.textContent = item.name;
                const description = document.createElement('p');
                description.textContent = item.description;
                const price = document.createElement('p');
                price.className = 'price';
                price.textContent = item.price;
                card.append(image, name, description, price);
                grid.appendChild(card);
            });
        }

        loadRestaurant().catch(error => {
            document.body.innerHTML = `<main class="section"><h1 class="error">No se pudo cargar el restaurante</h1><p>${error.message}</p></main>`;
        });
    </script>
</body>
</html>
